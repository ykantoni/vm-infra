name: Terraform

on:
  pull_request:
  push:
    branches:
      - devops
  workflow_dispatch:

# One Terraform run at a time against the runner's local state.
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
  PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: .
  BASE_BRANCH: main
  HEAD_BRANCH: devops

jobs:
  plan:
    # Never run code from a fork on the self-hosted runner: it sits on the
    # Proxmox host's network with its credentials.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    runs-on:
      - self-hosted
      - linux
      - terraform
      - proxmox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check Proxmox credentials
        run: |
          test -n "$PROXMOX_VE_ENDPOINT"
          test -n "$PROXMOX_VE_API_TOKEN"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            -lock-timeout=5m

          terraform show -no-color tfplan > terraform-plan.txt

      - name: Build PR body
        run: |
          set -euo pipefail

          cat > pr-body.md <<'EOF'
          ## Terraform plan

          This pull request was automatically created from the `devops` branch.

          <details>
          <summary>Show Terraform plan</summary>

          ```terraform
          EOF

          cat "${TF_WORKING_DIR}/terraform-plan.txt" >> pr-body.md

          cat >> pr-body.md <<'EOF'
          ```

          </details>
          EOF

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "Terraform plan: devops → main" \
              --body-file pr-body.md
          else
            gh pr edit "$PR_NUMBER" \
              --title "Terraform plan: devops → main" \
              --body-file pr-body.md
          fi                    

  # Plans again and applies in the same job, instead of handing a saved plan
  # to a second job through an artifact: a plan file embeds sensitive values
  # (kubeconfig, SSH key), and artifacts of a public repository are public.
  # Review the plan job's output before approving the "proxmox" environment.
  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: proxmox

    runs-on:
      - self-hosted
      - linux
      - terraform
      - proxmox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # Proxmox's API has no upload endpoint for snippets, so
      # proxmox_virtual_environment_file writes them over SSH as
      # github-runner (providers.tf). Whatever recreates this directory when
      # it's emptied (observed after a `terraform destroy`) resets it to
      # root:root 755, silently breaking that write -- reassert group-write
      # every run rather than relying on a one-time host change surviving.
      - name: Ensure snippets directory is writable
        run: sudo /usr/sbin/snippets-perms-fix

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Remove plan file
        if: always()
        run: rm -f tfplan
